name: Keep Streamlit app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sSL -c /tmp/cookies.txt -b /tmp/cookies.txt --max-time 120 \
            -o /dev/null -w "HTTP %{http_code} (%{num_redirects} redirects)\n" \
            https://ai-research-assistant-turazzi.streamlit.app
