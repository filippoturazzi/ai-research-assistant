name: Keep Streamlit app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: curl -sS --max-time 120 -o /dev/null -w "HTTP %{http_code}\n" https://ai-research-assistant-turazzi.streamlit.app
